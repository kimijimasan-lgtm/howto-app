<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errDiv = document.createElement('div');
      errDiv.style.position = 'fixed';
      errDiv.style.inset = '0';
      errDiv.style.background = '#7f1d1d';
      errDiv.style.color = '#fecaca';
      errDiv.style.padding = '2rem';
      errDiv.style.zIndex = '999999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.overflow = 'auto';
      errDiv.innerHTML = `
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">🚨 JavaScript Runtime Error</h1>
        <p><strong>Error:</strong> ${message}</p>
        <p><strong>Source:</strong> ${source}</p>
        <p><strong>Line:</strong> ${lineno} : ${colno}</p>
        <pre style="background: #450a0a; padding: 1rem; border-radius: 8px; margin-top: 1rem; white-space: pre-wrap;">${error ? error.stack : ''}</pre>
      `;
      document.body.appendChild(errDiv);
      return false;
    };
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PCスマホ連動メモ</title>
  <meta name="description" content="ハウツー・解説をカテゴリ別に管理するアプリ" />
  <!-- PWA / アイコン設定 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" type="image/png" href="icon.png" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PC連動メモ" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="visible"></div>
  <div id="modal-root"></div>

  <!-- Firebase CDN (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
